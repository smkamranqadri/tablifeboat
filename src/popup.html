<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Recovery</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell" aria-labelledby="popup-title">
      <header class="popup-header">
        <div>
          <h1 id="popup-title">Tab Recovery</h1>
          <p id="protected-count" class="protected-count">0 open protected tabs</p>
        </div>
      </header>
      <p id="popup-status" class="sr-only" role="status" aria-live="polite"></p>
      <div id="popup-content" aria-live="polite"></div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
